<div class="h-screen w-full bg-light-4 flex overflow-hidden">
  <div class="w-full lg:w-1/2 flex flex-col justify-between p-6 md:px-12 md:py-8 h-full">
    <div>
      <img src="/img/LOGO_RN.svg" alt="Hook Technologies" class="h-12" />
    </div>

    <div class="w-full max-w-90 mx-auto flex flex-col justify-center">
      <div class="text-center mb-6">
        <h1 class="heading-3 text-dark-1 mb-1">Login</h1>
        <p class="body-normal text-dark-2 text-sm">
          Por favor introduzca sus credenciales para iniciar sesión.
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-4">
        <app-input
          label="Email"
          type="email"
          placeholder="Introduzca su email"
          [control]="emailControl"
        >
        </app-input>

        <div>
          <app-input
            label="Contraseña"
            type="password"
            placeholder="*****************"
            [control]="passwordControl"
            [isPassword]="true"
          >
          </app-input>

          <!-- <div class="flex justify-end mt-1">
            <a href="#" class="label-normal text-dark-3 text-sm underline hover:text-dark-1 transition-colors">Olvidé mi contraseña</a>
          </div> -->
        </div>

        <div class="w-full mt-2">
          <app-button class="w-full" type="submit" variant="dark" [disabled]="loginForm.invalid">
            Iniciar sesión
          </app-button>
        </div>
      </form>
    </div>

    <div>
      <p class="body-normal text-dark-2 text-sm">© 2026 Hook Technologies</p>
    </div>
  </div>

  <div class="hidden lg:flex lg:w-1/2 p-4 md:p-6 h-full">
    <div class="w-full h-full rounded-2xl overflow-hidden bg-dark-1 relative shadow-card">
      <img
        src="https://placehold.co/500x600?text=Hook+Tech"
        alt="Hook Placeholder"
        class="absolute inset-0 w-full h-full object-cover"
      />
    </div>
  </div>
</div>
