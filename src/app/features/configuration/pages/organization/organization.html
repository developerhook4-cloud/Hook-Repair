<div
  class="flex-1 min-h-0 flex flex-col bg-white rounded-2xl p-6 md:p-10 shadow-sm overflow-y-auto relative"
>
  <div
    *ngIf="showSuccessToast"
    class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-brand-primary text-white px-8 py-3 rounded-full shadow-2xl flex items-center justify-center gap-3 z-100 transition-opacity duration-300"
  >
    <span class="label-normal font-bold">Cambios guardados</span>
  </div>

  <form
    [formGroup]="orgForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-6 w-full relative h-full"
  >
    <div
      [ngClass]="
        isSidebarCollapsed ? 'flex flex-col md:flex-row gap-8 md:gap-12' : 'flex flex-col gap-6'
      "
    >
      <section class="flex-1">
        <h2 class="heading-5 mb-8">Información general</h2>

        <div
          [ngClass]="
            isSidebarCollapsed
              ? 'flex flex-col gap-5'
              : 'grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4'
          "
        >
          <app-input
            label="Nombre"
            [isRequired]="true"
            placeholder="Nombre"
            [control]="getControl('name')"
          ></app-input>
          <app-input
            label="Email"
            [isRequired]="true"
            type="email"
            placeholder="ejemplo@ejemplo.com"
            [control]="getControl('email')"
          ></app-input>
          <app-input
            label="Teléfono"
            placeholder="+52 662 123 4567"
            [control]="getControl('phone')"
          ></app-input>
          <app-input
            label="Celular"
            placeholder="+52 662 123 4567"
            [control]="getControl('phone2')"
          ></app-input>

          <div [ngClass]="isSidebarCollapsed ? 'w-full' : 'md:col-span-2 md:w-[calc(50%-0.75rem)]'">
            <app-input
              label="Página web"
              placeholder="https://www.ejemplo.com"
              [control]="getControl('website')"
            ></app-input>
          </div>
        </div>
      </section>

      <div
        class="bg-gray-200"
        [ngClass]="isSidebarCollapsed ? 'hidden md:block w-px min-h-full' : 'h-px w-full'"
      ></div>

      <section class="flex-1">
        <h2 class="heading-5 mb-8">Ubicación</h2>

        <div
          [ngClass]="
            isSidebarCollapsed
              ? 'flex flex-col gap-5'
              : 'grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4'
          "
        >
          <div [ngClass]="isSidebarCollapsed ? 'w-full' : 'md:col-span-2'">
            <app-input
              label="Dirección"
              placeholder="Ingresa la calle, número y colonia"
              [control]="getControl('address')"
            ></app-input>
          </div>
          <app-input
            label="Ciudad"
            placeholder="Ingresa la ciudad"
            [control]="getControl('city')"
          ></app-input>
          <app-input
            label="Estado"
            placeholder="Ingresa el estado o provincia"
            [control]="getControl('state')"
          ></app-input>
          <app-input
            label="País"
            placeholder="Ingresa el país"
            [control]="getControl('country')"
          ></app-input>
          <app-input
            label="Código Postal"
            placeholder="Ej. 00000"
            [control]="getControl('postCode')"
          ></app-input>
        </div>
      </section>
    </div>

    <div class="flex justify-center mt-auto pt-8 pb-8">
      <div class="w-48">
        <app-button type="submit" [disabled]="orgForm.invalid" variant="color" shape="rounded">
          Guardar cambios
        </app-button>
      </div>
    </div>
  </form>
</div>
