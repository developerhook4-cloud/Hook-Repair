<div
  class="flex-1 min-h-0 flex flex-col bg-white rounded-2xl p-6 md:p-10 shadow-sm overflow-y-auto relative scroll-smooth"
>
  <div
    *ngIf="showSuccessToast"
    class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-brand-primary text-white px-8 py-3 rounded-full shadow-2xl flex items-center justify-center gap-3 z-100 transition-opacity duration-300"
  >
    <span class="label-normal font-bold">Cambios guardados</span>
  </div>

  <div class="w-full flex flex-col">
    <h2 class="heading-5 mb-8">Categorías de reparaciones</h2>

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div class="relative w-full md:w-80">
        <fa-icon
          [icon]="faSearch"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
        ></fa-icon>
        <input
          type="text"
          [(ngModel)]="searchCategoryTerm"
          placeholder="Buscar categoría..."
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:border-brand-primary body-normal text-dark-1 placeholder-gray-400"
        />
      </div>

      <button
        (click)="openAddCategoryModal()"
        class="w-full md:w-auto bg-brand-primary text-white px-6 py-2.5 rounded-lg label-normal font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-sm"
      >
        <fa-icon [icon]="faPlus" class="text-xs"></fa-icon> Agregar nueva categoría
      </button>
    </div>

    <div
      class="w-full border border-gray-100 rounded-[20px] bg-white flex flex-col mb-6 overflow-hidden shadow-sm"
    >
      <div
        *ngFor="let category of paginatedCategories; let last = last"
        class="py-4 px-6 flex justify-between items-center transition-colors hover:bg-gray-50"
        [ngClass]="{ 'border-b border-gray-200': !last }"
      >
        <div class="flex items-center justify-items-start">
          <h4 class="label-normal font-bold text-dark-1 mb-1 pr-3">{{ category.name }}</h4>

          <i [class]="category.icon" class="text-dark-1"></i>
        </div>
        <div class="flex items-center gap-2">
          <button
            (click)="openEditModal(category)"
            class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-brand-primary transition-colors"
          >
            <fa-icon [icon]="faPen"></fa-icon>
          </button>
          <button
            (click)="openDeleteModal(category)"
            class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
          >
            <fa-icon [icon]="faTrashCan"></fa-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="mt-auto pt-2 flex justify-between md:justify-end items-center gap-12 w-full body-normal font-semibold text-dark-2"
  >
    <div
      class="flex items-center gap-3 bg-white px-4 py-2 rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.08)]"
    >
      <button
        (click)="goToPage(currentPage - 1)"
        [disabled]="currentPage === 1"
        class="text-gray-400 hover:text-dark-1 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        <fa-icon [icon]="faChevronLeft"></fa-icon>
      </button>

      <div class="flex items-center gap-3">
        <button
          *ngFor="let page of pagesArray"
          (click)="goToPage(page)"
          class="w-6 h-6 flex items-center justify-center rounded-full transition-colors label-normal"
          [ngClass]="
            currentPage === page ? 'bg-brand-primary text-white' : 'hover:text-brand-primary'
          "
        >
          {{ page }}
        </button>
      </div>
      <button
        (click)="goToPage(currentPage + 1)"
        [disabled]="currentPage === totalPages"
        class="text-dark-1 hover:text-brand-primary disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        <fa-icon [icon]="faChevronRight"></fa-icon>
      </button>
    </div>

    <div class="hidden md:flex items-center gap-3">
      <span>Ir a pág.</span>
      <input
        type="number"
        [(ngModel)]="pageInput"
        (change)="goToPage(pageInput)"
        min="1"
        [max]="totalPages"
        class="bg-gray-100 rounded-lg w-9 h-9 text-center p-0 text-gray-600 focus:outline-none focus:ring-1 focus:ring-brand-primary"
      />
    </div>
  </div>
</div>

<div
  *ngIf="isAddCategoryModalOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-gray-500/20 backdrop-blur-sm p-4 md:p-6"
>
  <div
    class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col max-h-[90vh] overflow-hidden border border-gray-100"
  >
    <div class="p-12 pb-4">
      <div class="flex justify-between items-start mb-6">
        <h2 class="heading-5 text-dark-1">
          {{ modalMode === 'create' ? 'Agregar nueva categoría' : 'Editar categoría' }}
        </h2>
        <button
          (click)="closeAddCategoryModal()"
          class="text-gray-400 hover:text-dark-1 transition-colors"
        >
          <fa-icon [icon]="faXmark" class="text-xl"></fa-icon>
        </button>
      </div>

      <div class="flex flex-col mb-6">
        <label class="label-normal font-semibold text-dark-1 mb-2">
          Nombre de la categoría <span class="text-brand-primary">*</span>
        </label>
        <input
          type="text"
          [value]="selectedCategory?.name"
          (input)="updateCategoryName($event)"
          placeholder="Introduzca el nombre de la categoría"
          class="w-full md:w-80 border border-gray-300 rounded-[14px] px-4 py-2.5 focus:outline-none focus:border-brand-primary body-normal placeholder-gray-400"
        />
      </div>
      <div class="flex flex-col mb-6">
        <label class="label-normal font-semibold text-dark-1 mb-2"> Ícono para la categoría </label>

        <app-icon-search (iconSelected)="onIconSelected($event)" />
      </div>

      <div class="p-6 md:px-8 border-t border-gray-100 bg-white flex justify-end gap-4 mt-auto">
        <button
          (click)="closeAddCategoryModal()"
          class="px-6 py-2.5 rounded-lg bg-gray-100 text-dark-2 font-bold label-normal hover:bg-gray-200 transition-colors"
        >
          Cancelar
        </button>
        <button
          (click)="saveNewCategory()"
          [disabled]="!newCategoryName.trim()"
          class="px-6 py-2.5 rounded-lg bg-brand-primary text-white font-bold label-normal transition-all shadow-sm"
          [ngClass]="newCategoryName.trim() ? 'hover:opacity-90' : 'opacity-50 cursor-not-allowed'"
        >
          {{ modalMode === 'create' ? 'Agregar categoría' : 'Guardar cambios' }}
        </button>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="isDeleteModalOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-gray-500/20 backdrop-blur-sm p-4"
>
  <div
    class="bg-white rounded-2xl shadow-2xl w-full max-w-100 p-8 flex flex-col items-center text-center border border-gray-100 animate-fade-in"
  >
    <div
      class="h-16 w-16 rounded-full bg-error-subtle text-brand-primary flex items-center justify-center mb-6"
    >
      <fa-icon [icon]="faTriangleExclamation" class="text-3xl"></fa-icon>
    </div>
    <h3 class="heading-5 mb-3">Eliminar categoría</h3>
    <p class="body-normal text-dark-2 mb-8">
      ¿Está seguro de que desea eliminar la categoría
      <strong class="text-dark-1">“{{ categoryToDelete?.name }}”</strong>?
    </p>
    <div class="flex justify-center gap-4 w-full">
      <button
        (click)="closeDeleteModal()"
        class="flex-1 py-3 rounded-2xl bg-gray-100 text-dark-2 label-normal hover:bg-gray-200 transition-colors"
      >
        Cancelar
      </button>
      <button
        (click)="confirmDelete()"
        class="flex-1 py-3 rounded-2xl bg-brand-primary text-white label-normal hover:opacity-90 transition-opacity shadow-sm"
      >
        Sí, eliminar
      </button>
    </div>
  </div>
</div>
