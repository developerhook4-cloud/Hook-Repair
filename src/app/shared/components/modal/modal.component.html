@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-black/60 backdrop-blur-sm p-4 transition-all duration-300"
  >
    <div
      class="relative w-full bg-white rounded-[24px] shadow-2xl flex flex-col"
      [ngClass]="size === 'sm' ? 'max-w-md' : 'max-w-2xl'"
    >
      <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
        <h3 class="text-xl font-bold text-gray-900">{{ title }}</h3>
        <button
          (click)="close.emit()"
          class="text-gray-400 hover:text-gray-800 transition-colors h-8 w-8 flex items-center justify-center rounded-full hover:bg-gray-100"
        >
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto max-h-[70vh]">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
